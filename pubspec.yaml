name: coach_app_mobile
description: "A new Flutter project."

# Prevents the package from being accidentally published to pub.dev.
publish_to: 'none'

# Application version and build number.
version: 1.0.0+10

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Cupertino Icons for iOS-style icons.
  cupertino_icons: ^1.0.8

  # Navigation.
  go_router: ^16.2.1

  # State management.
  flutter_riverpod: ^3.4.2

  # Firebase.
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.4.6
  firebase_messaging: ^16.5.0

  # Image selection.
  image_picker: ^1.2.3

  # Location.
  geolocator: ^14.0.3

dev_dependencies:
  # Flutter testing framework.
  flutter_test:
    sdk: flutter

  # Recommended Flutter lint rules.
  flutter_lints: ^6.0.0

  # Generates application launcher icons.
  flutter_launcher_icons: ^0.14.4

# Configuration for flutter_launcher_icons.
flutter_launcher_icons:
  # Generate Android launcher icons.
  android: true

  # Source image for the application icon.
  image_path: "assets/images/logo_coach.png"

  # Adaptive Android icon background.
  adaptive_icon_background: "#FFFFFF"

  # Adaptive Android icon foreground.
  adaptive_icon_foreground: "assets/images/logo_coach.png"

# Flutter-specific configuration.
flutter:
  # Includes Material Icons.
  uses-material-design: true

  # Application assets.
  assets:
    - assets/images/logo_coach.png